<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Katalog Buku - BukuKita</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="topbar"><a class="brand" href="dashboard.html">📚 BukuKita</a><nav><a href="dashboard.html">Dashboard</a><a class="active" href="stok.html">Katalog</a><a href="checkout.html">Pemesanan</a><a href="tracking.html">Pengiriman</a></nav><a class="btn outline small" href="login.html">Keluar</a></header>
<main class="container"><div class="page-heading"><div><p class="eyebrow">DATA PRODUK</p><h1>Informasi Stok Buku</h1><p class="muted">Daftar buku tersedia di toko.</p></div></div>
<section class="panel"><h2>Tambah Buku Baru</h2><form id="bookForm" class="form-grid"><div><label>Judul Buku</label><input id="bookTitle" required placeholder="Contoh: Laskar Pelangi"></div><div><label>Penulis</label><input id="bookAuthor" required placeholder="Nama penulis"></div><div><label>Harga (Rp)</label><input id="bookPrice" type="number" min="1" required placeholder="50000"></div><div><label>Stok</label><input id="bookStock" type="number" min="0" required placeholder="10"></div><div class="form-action"><button class="btn primary" type="submit">＋ Tambahkan Buku</button></div></form></section>
<section class="panel"><div class="panel-heading"><h2>Daftar Katalog</h2><input id="searchBook" class="search" placeholder="Cari judul buku..."></div><div class="table-wrap"><table><thead><tr><th>No</th><th>Judul Buku</th><th>Penulis</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead><tbody id="bookTable"></tbody></table></div></section></main><footer>© 2026 BukuKita</footer><script src="js/data.js"></script><script src="js/stok.js"></script></body></html>
