<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - BukuKita</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<main class="auth-card">
  <div class="brand">📚 BukuKita</div>
  <h1>Selamat Datang</h1><p class="muted">Masuk untuk melanjutkan belanja buku.</p>
  <form id="loginForm">
    <label for="email">Email</label><input id="email" type="email" placeholder="nama@email.com" required>
    <label for="password">Password</label><input id="password" type="password" placeholder="Masukkan password" required>
    <button class="btn primary full" type="submit">Login</button>
  </form>
  <div class="auth-links"><button class="link-btn" id="forgotBtn">Lupa Password?</button><button class="link-btn" id="registerBtn">Daftar</button></div>
  <p class="hint">Akun demo: admin@bukukita.com / 123456</p>
  <a class="back-link" href="dashboard.html">Lihat dashboard demo →</a>
</main>
<div class="modal hidden" id="authModal"><div class="modal-box"><button class="close" id="closeModal">×</button><h2 id="modalTitle">Informasi</h2><div id="modalContent"></div></div></div>
<script src="js/data.js"></script><script src="js/login.js"></script>
</body></html>
